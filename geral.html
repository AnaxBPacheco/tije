<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta ame="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quadro Geral de Nomeações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style/main.css" />
    <link rel="icon" type="image/png" href="assets/img/favicon.ico">
</head>

<body class="bg-gray-50">
    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
              <div class="flex-shrink-0">
                <h1 class="text-xl font-bold text-gray-800">
                    Nomeações de TI na Justiça Eleitoral
                </h1>
              </div>
            <nav class="hidden md:block">
              <div class="ml-10 flex items-baseline space-x-4">
                <a
                  href="index.html"
                  class="text-gray-600 hover:bg-gray-200 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium"
                  >Início</a
                >
              </div>
          </nav>
        </div>
    </header>

    <main class="bg-white-200">

        <div
            class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8 text-center">

            <h1
                class="text-4xl tracking-tight font-extrabold text-gray-900 sm:text-5xl">

                <span class="block text-indigo-600">Quadro Geral de Nomeações</span>

            </h1>

          <p class="mt-6 max-w-2xl mx-auto text-lg text-gray-500 sm:text-xl">
            Última nomeação: <span id="ultima-nomeacao">-</span>
            <br />
            Total de nomeados: <span id="total-nomeados">0</span>
          </p>

        </div>

    </main>
    
    <section class="container mx-auto p-4 sm:p-6 lg:p-8 space-y-12">
      <div>
        <h2 class="text-2xl font-bold text-gray-800 mb-4">
          Analista Judiciário
        </h2>
        <table class="w-full text-sm text-left text-gray-600 table-auto">
                <thead class="text-xs text-gray-700 uppercase bg-gray-300">
                  <tr>
                    <th scope="col" class="px-3 py-3">#</th>
                    <th scope="col" class="px-3 py-3">Tribunal</th>
                    <th scope="col" class="px-6 py-3">Data</th>
                    <th scope="col" class="px-6 py-3">Posição Convocação</th>
                  </tr>
                </thead>
                <tbody id="tabela-analistas"></tbody>
          </table>
      </div>
    </section>

    <section class="container mx-auto p-4 sm:p-6 lg:p-8 space-y-12">
      <div>
        <h2 class="text-2xl font-bold text-gray-800 mb-4">
          Técnico Judiciário
        </h2>
        <table class="w-full text-sm text-left text-gray-600 table-auto">
                <thead class="text-xs text-gray-700 uppercase bg-gray-300">
                  <tr>
                    <th scope="col" class="px-3 py-3">#</th>
                    <th scope="col" class="px-3 py-3">Tribunal</th>
                    <th scope="col" class="px-6 py-3">Data</th>
                    <th scope="col" class="px-6 py-3">Posição Convocação</th>
                  </tr>
                </thead>
                <tbody id="tabela-tecnicos"></tbody>
          </table>
      </div>
    </section>
    
    <script src="js/geral.js"></script>

</body>

</html>
